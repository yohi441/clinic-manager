{% with s=p.status %}
{% if s == "Consultation" %}<span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-700">Consultation</span>
{% elif s == "Fitting" %}<span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-700">Fitting</span>
{% elif s == "In Production" %}<span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-violet-100 text-violet-700">In Production</span>
{% elif s == "Ready" %}<span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700">Ready</span>
{% elif s == "Completed" %}<span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600">Completed</span>
{% else %}<span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600">{{ s }}</span>
{% endif %}
{% endwith %}
