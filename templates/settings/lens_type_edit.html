<div class="bg-white rounded-2xl w-full max-w-sm mx-4 max-h-[90vh] overflow-y-auto slide-in" @click.stop>
  <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
    <h3 class="text-lg font-bold text-slate-800">Edit Lens Type</h3>
    <button @click="modalOpen = false" class="p-1 rounded-lg hover:bg-slate-100 transition-colors">
      <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>
  <form hx-post="{% url 'lens-type-edit' lt.id %}" hx-target="#lens-type-table-container" hx-swap="outerHTML" class="p-6 space-y-4">
    {% csrf_token %}
    {% if error %}
    <div class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2">{{ error }}</div>
    {% endif %}
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1.5">Name</label>
      <input type="text" name="name" value="{{ submitted_name|default:lt.name }}" required
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20">
    </div>
    <div class="flex justify-end gap-3 pt-2">
      <button type="button" @click="modalOpen = false"
        class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">Cancel</button>
      <button type="submit"
        class="px-4 py-2 bg-primary-600 text-white rounded-lg text-sm font-medium hover:bg-primary-700 transition-colors shadow-sm">Save</button>
    </div>
  </form>
</div>
