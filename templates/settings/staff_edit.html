<div class="bg-white rounded-2xl w-full max-w-md mx-4 max-h-[90vh] overflow-y-auto slide-in" @click.stop>
  <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
    <h3 class="text-lg font-bold text-slate-800">Edit Staff</h3>
    <button @click="modalOpen = false" class="p-1 rounded-lg hover:bg-slate-100 transition-colors">
      <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>
  <form method="post" action="{% url 'staff-edit' u.id %}" class="p-6 space-y-4">
    {% csrf_token %}
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">First Name</label>
        <input type="text" name="first_name" value="{{ u.first_name }}"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Last Name</label>
        <input type="text" name="last_name" value="{{ u.last_name }}"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20">
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
      <input type="text" name="username" value="{{ u.username }}" required
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1.5">Role</label>
      <select name="role" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-primary-500/20">
        <option value="staff" {% if u.profile.role == 'staff' %}selected{% endif %}>Staff</option>
        <option value="optometrist" {% if u.profile.role == 'optometrist' %}selected{% endif %}>Optometrist</option>
        <option value="admin" {% if u.profile.role == 'admin' %}selected{% endif %}>Admin</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1.5">New Password</label>
      <input type="password" name="password" placeholder="Leave blank to keep current"
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20">
    </div>
    <div class="flex justify-end gap-3 pt-2">
      <button type="button" @click="modalOpen = false"
        class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50">Cancel</button>
      <button type="submit"
        class="px-4 py-2 bg-primary-600 text-white rounded-lg text-sm font-medium hover:bg-primary-700 transition-colors shadow-sm">Save</button>
    </div>
  </form>
</div>
